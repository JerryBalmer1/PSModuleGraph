name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.powershell }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            powershell: pwsh
          # Windows PowerShell 5.1 is load-bearing: the manifest claims Desktop
          # compatibility and this leg is the only thing proving it.
          - os: windows-latest
            powershell: powershell
          - os: ubuntu-latest
            powershell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PSGraphRender holds the renderer and is a RequiredModules entry, so
      # nothing here imports without it. It is not published, so the build
      # resolves a sibling checkout - see the Dependencies task. Checking it out
      # beside this repository is what makes that path the same locally and in
      # CI.
      #
      # PINNED to a tag. Tracking the default branch meant a change there could
      # turn this red with nothing changed here and, worse, a green run proved
      # compatibility with whatever happened to be on main that morning rather
      # than with the version the manifest declares.
      #
      # The ref must match the RequiredModules floor in PSModuleGraph.psd1.
      # tests/PreTag.Tests.ps1 asserts they agree, so this cannot drift.
      - name: Checkout PSGraphRender
        uses: actions/checkout@v4
        with:
          repository: JerryBalmer1/PSGraphRender
          ref: v0.7.0
          path: PSGraphRender-checkout

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/powershell/Modules
            ~/Documents/PowerShell/Modules
            ~/Documents/WindowsPowerShell/Modules
          key: ${{ runner.os }}-${{ matrix.powershell }}-psmodules-${{ hashFiles('Requirements.psd1') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.powershell }}-psmodules-

      # -Bootstrap installs any missing dependency and then runs the default
      # task (Clean, Lint, Build, Test), so one invocation is enough.
      - name: Build PSGraphRender
        shell: ${{ matrix.powershell }} {0}
        working-directory: PSGraphRender-checkout
        run: ./build.ps1 -Bootstrap -Task Build

      - name: Bootstrap and test
        shell: ${{ matrix.powershell }} {0}
        env:
          # The sibling layout the Dependencies task looks for does not exist
          # here - actions/checkout puts the second repository inside the first.
          # Naming the path explicitly is the documented alternative.
          PSGRAPHRENDER_MODULE_PATH: ${{ github.workspace }}/PSGraphRender-checkout/output
        run: ./build.ps1 -Bootstrap

      - name: Publish test results and coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.powershell }}
          path: output/*.xml
          if-no-files-found: warn
